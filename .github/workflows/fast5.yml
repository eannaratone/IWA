name: FAST with Fortify ScanCentral DAST (Advantage - Firefox)

on:
  workflow_dispatch:
    inputs:
      runFortifyFAST:
        description: 'Run Fortify ScanCentral FAST Scan'
        required: false
        default: 'true'

env:
  DEFAULT_APP_NAME: "Advantage Online Shopping"
  DEFAULT_APP_URL: "https://advantageonlineshopping.com"
  DEFAULT_PYTHON_VERSION: "3.12.3"
  DEFAULT_IMAGE_NAME: "fortifydocker/fortify-fast:25.4.ubuntu.2204"
  DEFAULT_CONTAINER_NAME: "fast-advantage-ff"
  DEFAULT_FAST_PORT: 8087
  DEFAULT_FAST_PROXY: "127.0.0.1:8087"

jobs:
  Run-FAST-Scan-FF:
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.runFortifyFAST == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Make envfile
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_APP_NAME: ${{ env.DEFAULT_APP_NAME }}
          envkey_APP_URL: ${{ env.DEFAULT_APP_URL }}
          envkey_FAST_PORT: ${{ env.DEFAULT_FAST_PORT }}
          envkey_FAST_PROXY: ${{ env.DEFAULT_FAST_PROXY }}
          file_name: .env
          fail_on_empty: false
          sort_keys: false

      - name: Start FAST Container
        shell: bash
        run: |
          echo "Starting FAST Container"
          cat .env
          if [ -z "${SCANCENTRAL_DAST_API}" ] || [ -z "${SSC_CI_TOKEN}" ] || [ -z "${SCANCENTRAL_DAST_CICD_TOKEN}" ]; then
            echo "FAST env missing (SCANCENTRAL_DAST_API / SSC_CI_TOKEN / SCANCENTRAL_DAST_CICD_TOKEN). Skipping FAST start."
            exit 0
          fi
          mkdir -p "$HOME/.fast/certs"
          chmod 0777 "$HOME/.fast/certs"
          echo "Launching container: ${CONTAINER_NAME}"
          docker run --name "$CONTAINER_NAME" -d \
            --user 0 \
            -p ${FAST_PORT}:8087 \
            -v "$HOME/.fast/certs:/etc/fast/certs" \
            "$IMAGE_NAME" \
            -k -p "${FAST_PORT}" \
            -u "${SCANCENTRAL_DAST_API}" \
            -CIToken "${SSC_CI_TOKEN}" \
            -CICDToken "${SCANCENTRAL_DAST_CICD_TOKEN}" \
            -n "${APP_NAME} FAST Scan"
          docker logs "$CONTAINER_NAME" --since 10s || true
        env:
          IMAGE_NAME: ${{ env.DEFAULT_IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.DEFAULT_CONTAINER_NAME }}
          FAST_PORT: ${{ env.DEFAULT_FAST_PORT }}
          SCANCENTRAL_DAST_API: ${{ vars.FORTIFY_SCDAST_API_URL }}
          SSC_CI_TOKEN: ${{ secrets.FORTIFY_SSC_TOKEN }}
          SCANCENTRAL_DAST_CICD_TOKEN: ${{ vars.FORTIFY_SCDAST_FAST_CICD_TOKEN }}
          APP_NAME: ${{ env.DEFAULT_APP_NAME }}

      # Firefox + Geckodriver
      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@v0.0.0  # <= etiqueta válida hoy
        with:
          geckodriver-version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest selenium pytest-selenium
          pip install pytest-xdist pytest-md pytest-emoji

      - name: Run Selenium test (Firefox)
        run: |
          echo "APP_URL=$APP_URL"
          echo "FAST_PROXY=$FAST_PROXY"
          xvfb-run -a pytest -v --maxfail=1 tests/AdvShopAppFF.py
        env:
          APP_URL: ${{ env.DEFAULT_APP_URL }}
          FAST_PROXY: ${{ env.DEFAULT_FAST_PROXY }}

      - name: Stop FAST Container
        shell: bash
        run: |
          echo "Stopping FAST Container"
          if docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}$"; then
            echo ">>> Last 30s of logs BEFORE stop"
            docker logs "$CONTAINER_NAME" --since 30s || true
            if docker ps --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}$"; then
              echo ">>> Sending graceful stop to FAST"
              docker exec "$CONTAINER_NAME" fast -p "${FAST_PORT}" -s || true
              sleep 5
            fi
            echo ">>> Stopping container"
            docker stop "$CONTAINER_NAME" || true
            echo ">>> Containers after stop"
            docker ps -a || true
          else
            echo "Container '${CONTAINER_NAME}' not found; skipping."
          fi
        env:
          CONTAINER_NAME: ${{ env.DEFAULT_CONTAINER_NAME }}
          FAST_PORT: ${{ env.DEFAULT_FAST_PORT }}
